name: Admin CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_FIREBASE_API_KEY: firebase-test-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: vekko-test.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: vekko-test
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:123456789:web:test'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Unit tests
        run: corepack pnpm test

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Build
        run: corepack pnpm build
